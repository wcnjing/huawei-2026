<!DOCTYPE html>
<!--
  data-palette picks the light theme's colours: "mist" (default), "paper" or "dusk".
  See src/styles/tokens.css. Add ?palette=paper to the address to preview one in light mode.
-->
<html lang="en" data-palette="mist">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the theme before the app paints, so nobody sees a flash of the other one: the
      // player's own pick if they made one, otherwise the device's light/dark setting.
      // src/app/theme/ThemeProvider.tsx applies the same rule once the app is running.
      (function () {
        var root = document.documentElement;
        var saved = null;
        try { saved = localStorage.getItem("safespace_theme"); } catch (e) { /* private mode */ }
        var deviceLight = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
        root.dataset.theme = saved === "light" || saved === "dark" ? saved : deviceLight ? "light" : "dark";
        try {
          var preview = new URLSearchParams(location.search).get("palette");
          if (preview) sessionStorage.setItem("safespace_palette_preview", preview);
          var palette = sessionStorage.getItem("safespace_palette_preview");
          if (palette) { root.dataset.palette = palette; root.dataset.theme = "light"; }
        } catch (e) { /* no preview */ }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeSpace Drill Mode</title>
    <meta
      name="description"
      content="Retro-styled SafeSpace drill mode UI for scam call, SMS, and email training."
    />

    <!-- Installable to the home screen: tapping the icon launches without the
         browser URL bar, which is what makes it read as an app on stage. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS ignores the manifest entirely and needs its own tags. Status bar is
         "black" rather than "black-translucent" on purpose: translucent draws
         content underneath the clock, which would collide with the top of the
         UI unless every screen handled safe-area insets. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="SafeSpace" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--page-backdrop, #05080f);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
